<div class="dropdown-items__container">
  <div class="dropdown-personal">
   <div class="items" (click)="toggleFolder1()"
    [ngClass]="{'dropdown-active': service.folder1Open}"
   >
      <img class="arrow" [class.open]="service.folder1Open" src="assets/icons/arrow-down-s-line.svg" alt="arrow">
      <img src="assets/icons/gitlab-fill.svg" alt="folder">
      <p>exp.json</p>
   </div>
   <div class="items" (click)="toggleFolder2()"
    [ngClass]="{'dropdown-active': service.folder2Open}"
   >
      <img class="arrow" [class.open]="service.folder2Open" src="assets/icons/arrow-down-s-line.svg" alt="arrow">
      <img src="assets/icons/code-s-slash-fill.svg" alt="code">
      <p>tech-stack.json</p>
   </div>
  </div>
</div>
